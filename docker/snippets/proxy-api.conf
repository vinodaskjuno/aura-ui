# Shared proxy headers for plain HTTP API traffic.
# uvicorn runs with --proxy-headers, so X-Forwarded-* are trusted and used to
# reconstruct the client's scheme/host for redirects and logging.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    120s;

# LLM calls stream for a long time. src/advisor/bedrock.py:68 alone allows a 60s
# read timeout per Bedrock call, and a ReAct turn makes several in sequence.
proxy_read_timeout    300s;

proxy_buffering off;   # stream token-by-token responses through immediately
