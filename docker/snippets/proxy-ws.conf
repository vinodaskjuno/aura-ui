# Shared proxy headers for WebSocket endpoints.
# Used by /ws/advisor, /ws/orchestrate, and the /api/*/ws/* sockets that fall
# through the /api/ location.
proxy_http_version 1.1;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;

# Long-lived and often silent. An advisor turn can sit quiet for minutes while
# the model streams, and only /api/qa/ws/container-run sends a server-side
# heartbeat (src/routers/qa.py:396-410). Keep these well above the ALB idle
# timeout so nginx is never the component that drops the socket.
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

proxy_buffering off;
